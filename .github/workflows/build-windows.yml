name: Build Windows Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: electron/backend
        run: npm install --ignore-scripts

      - name: Install electron deps
        working-directory: electron
        run: npm install

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Rebuild natives for Electron
        working-directory: electron
        run: npx electron-rebuild -f -w better-sqlite3,bcrypt,@thiagoelg/node-printer -m ./backend

      - name: Build backend
        working-directory: electron/backend
        run: npm run build

      - name: Build Electron installer
        working-directory: electron
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sufra-lite-windows-installer
          path: electron/release/*.exe
