name: Build Windows Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # VS 2022 is present here. windows-latest ships VS 2026, which node-gyp 10
    # cannot detect, so any source build fails.
    runs-on: windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # better-sqlite3 12 requires Node 20+; Node 18 has no prebuilt binaries.
          node-version: 20

      # node-gyp's bundled gyp imports distutils, removed from Python in 3.12.
      # The runner ships 3.14, so pin an older Python for the native builds.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --ignore-scripts skips the native build here. These modules load inside
      # Electron, not Node, so they are built once by electron-rebuild below.
      - name: Install backend deps
        working-directory: electron/backend
        run: npm install --ignore-scripts

      - name: Install electron deps
        working-directory: electron
        run: npm install

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Rebuild natives for Electron
        working-directory: electron
        run: npx electron-rebuild -f -w better-sqlite3,bcrypt,@thiagoelg/node-printer -m ./backend

      - name: Build backend
        working-directory: electron/backend
        run: npm run build

      - name: Build Electron installer
        working-directory: electron
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sufra-lite-windows-installer
          path: electron/release/*.exe
